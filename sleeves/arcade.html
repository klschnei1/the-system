<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cybernetica // Arcade</title>
<link rel="manifest" href="../manifest.json">
<style>
  :root {
    --bezel:        #1a0f2e;
    --bezel-light:  #2d1b4e;
    --bezel-shadow: #0a0518;
    --pink:   #ff6ec7;
    --pink-d: #b04088;
    --cyan:   #5ac8fa;
    --cyan-d: #2599c8;
    --gold:   #ffd700;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #07070f;
    font-family: 'Courier New', monospace;
    color: #fff;
    overflow: hidden;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .device {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
    height: 100dvh;
    padding: 12px;
    gap: 14px;
  }
  .header {
    font-size: 9px;
    letter-spacing: 4px;
    color: var(--pink);
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 0 8px rgba(255,110,199,0.5);
  }
  .screen-wrap {
    background: var(--bezel);
    border: 4px solid var(--bezel-light);
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 8px 24px rgba(255, 110, 199, 0.25), inset 0 2px 4px var(--bezel-shadow);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    width: min(85vw, 380px);
    height: auto;
    aspect-ratio: 320 / 240;
    background: #000;
  }
  .controls {
    display: flex;
    width: 100%;
    max-width: 420px;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
  }
  .dpad {
    display: grid;
    grid-template-columns: 46px 46px 46px;
    grid-template-rows: 46px 46px 46px;
    gap: 2px;
  }
  .dpad button, .dpad .center {
    background: var(--bezel);
    border: 2px solid var(--bezel-light);
    color: var(--pink);
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 6px;
    touch-action: none;
    padding: 0;
  }
  .dpad button:active { background: var(--pink); color: var(--bezel); }
  .dpad .up    { grid-column: 2; grid-row: 1; }
  .dpad .left  { grid-column: 1; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .dpad .down  { grid-column: 2; grid-row: 3; }
  .dpad .center {
    grid-column: 2; grid-row: 2;
    background: var(--bezel-light);
    border: none;
    pointer-events: none;
  }

  .ab {
    display: flex;
    gap: 14px;
    align-items: flex-end;
    transform: rotate(-18deg);
  }
  .ab button {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    font-family: inherit;
    cursor: pointer;
    touch-action: none;
    padding: 0;
    border: 3px solid;
  }
  .ab .a {
    background: var(--pink);
    border-color: var(--pink-d);
    box-shadow: 0 4px 0 var(--pink-d);
  }
  .ab .b {
    background: var(--cyan);
    border-color: var(--cyan-d);
    box-shadow: 0 4px 0 var(--cyan-d);
  }
  .ab .a:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--pink-d); }
  .ab .b:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--cyan-d); }

  .footer {
    font-size: 8px;
    letter-spacing: 3px;
    color: #666;
    text-align: center;
  }
</style>
</head>
<body>

<div class="device">
  <div class="header">CYBERNETICA · NILE-184</div>
  <div class="screen-wrap">
    <canvas id="screen" width="640" height="480"></canvas>
  </div>
  <div class="controls">
    <div class="dpad">
      <button class="up" data-key="ArrowUp">▲</button>
      <button class="left" data-key="ArrowLeft">◀</button>
      <div class="center"></div>
      <button class="right" data-key="ArrowRight">▶</button>
      <button class="down" data-key="ArrowDown">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-key="b">B</button>
      <button class="a" data-key="a">A</button>
    </div>
  </div>
  <div class="footer">A: ENTER · B: BACK · DPAD: MOVE</div>
</div>

<script>
// ==== CONFIG ===========================================================
const TILE = 32;
const COLS = 36;         // world width in tiles
const ROWS = 24;         // world height in tiles
const VW   = 20;         // viewport width  (canvas stays 320px)
const VH   = 15;         // viewport height (canvas stays 240px)
const W = VW * TILE;     // 320 — canvas pixel width
const H = VH * TILE;     // 240 — canvas pixel height

const cnv = document.getElementById('screen');
const ctx = cnv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ==== ASSETS ============================================================
// TILE TUNING: terrain_atlas.png is a 1024×1024 sheet at 16px tiles (64×64 grid).
// If the tiles look wrong, adjust the [col, row] values below.
const SHEET_TILE = 16;
const T_GRASS = [0, 46]; // green grass — bottom-left of terrain_atlas
const T_PATH  = [1, 37]; // gray stone — this coordinate confirmed working

let terrainSheet = null;
let townSheet = null;
let playerSheet = null;
const PLAYER_CHAR = Math.floor(Math.random() * 32) + 1;

let buildingsSheet = null;

function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function drawTile(sheet, col, row, dx, dy) {
  ctx.drawImage(sheet,
    col * SHEET_TILE, row * SHEET_TILE, SHEET_TILE, SHEET_TILE,
    dx, dy, TILE, TILE);
}

// px/py = pixel position on canvas. w/h = native sprite size.
// solidCol/Row/W/H = tile-grid collision footprint.
// Top row anchors from y=0; bottom row anchors from y=160.
const DOMAINS = [
  // sx/sy/sw/sh = crop from Buildings_Colour2.png (1136×197)
  // Top row: anchored from py=0
  { key: 'hod',     name: 'INTELLECT', glyph: 'eye',    roof: '#ff8c42',
    sx: 474, sy: 0, sw: 118, sh: 197,  px: 8,   py: 0,   w: 112, h: 160,
    solidCol: 0,  solidRow: 1, solidW: 4, solidH: 5 },
  { key: 'geburah', name: 'STRENGTH',  glyph: 'khopesh', roof: '#ff5577',
    sx: 0,   sy: 0, sw: 121, sh: 197,  px: 144, py: 16,  w: 128, h: 144,
    solidCol: 4,  solidRow: 0, solidW: 4, solidH: 4 },
  { key: 'malkuth', name: 'INTAKE',    glyph: 'wheat',  roof: '#00d4ff',
    sx: 595, sy: 0, sw: 131, sh: 197,  px: 312, py: 16,  w: 128, h: 144,
    solidCol: 9,  solidRow: 0, solidW: 4, solidH: 4 },
  { key: 'yesod',   name: 'RECOVERY',  glyph: 'ankh',   roof: '#b06bff',
    sx: 1047,sy: 0, sw: 88,  sh: 197,  px: 480, py: 32,  w: 96,  h: 128,
    solidCol: 15, solidRow: 0, solidW: 3, solidH: 4 },
  // Bottom row
  { key: 'chesed',  name: 'CAPITAL',   glyph: 'scales', roof: '#5dffb4',
    sx: 857, sy: 0, sw: 188, sh: 197,  px: 8,   py: 320, w: 160, h: 144,
    solidCol: 0,  solidRow: 12, solidW: 5, solidH: 4 },
  { key: 'binah',   name: 'STRUCTURE', glyph: 'pyramid', roof: '#ffd166',
    sx: 729, sy: 0, sw: 125, sh: 197,  px: 184, py: 320, w: 128, h: 144,
    solidCol: 5,  solidRow: 11, solidW: 4, solidH: 4 },
  { key: 'netzach', name: 'CREATION',  glyph: 'lyre',   roof: '#ff6ec7',
    sx: 131, sy: 0, sw: 74,  sh: 197,  px: 344, py: 320, w: 96,  h: 144,
    solidCol: 10, solidRow: 11, solidW: 3, solidH: 4 },
  { key: 'chokmah', name: 'SOCIAL',    glyph: 'figures', roof: '#06ffa5',
    sx: 367, sy: 0, sw: 103, sh: 197,  px: 488, py: 320, w: 96,  h: 144,
    solidCol: 15, solidRow: 11, solidW: 3, solidH: 4 },
];

// Solid map from domain footprints
const solid = [];
for (let r = 0; r < ROWS; r++) solid.push(new Array(COLS).fill(0));
DOMAINS.forEach(d => {
  for (let dy = 0; dy < d.solidH; dy++)
    for (let dx = 0; dx < d.solidW; dx++) {
      const r = d.solidRow + dy, c = d.solidCol + dx;
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) solid[r][c] = 1;
    }
});

// ==== STATE ============================================================
let player = { x: 10, y: 7, dir: 'down', stepFrame: 0 };
let dialogOpen = false;
let dialogDomain = null;
let dialogText = '';
let dialogShown = 0;
let typewriterTick = 0;

// ==== HIEROGLYPHS (8x8 pixel patterns) =================================
const GLYPHS = {
  eye: [
    ' XXXXXX ',
    'X      X',
    'X  XX  X',
    'X XXXX X',
    'X  XX  X',
    'X      X',
    ' XXXXXX ',
    ' X    X ',
  ],
  khopesh: [
    '  X     ',
    '  X     ',
    '  X     ',
    '  XX    ',
    '   XX   ',
    ' XXXX   ',
    'XX      ',
    'X       ',
  ],
  wheat: [
    '   X    ',
    '  XXX   ',
    ' X X X  ',
    '  XXX   ',
    ' X X X  ',
    '  XXX   ',
    '   X    ',
    '   X    ',
  ],
  ankh: [
    '  XXX   ',
    ' X   X  ',
    ' X   X  ',
    '  XXX   ',
    'XXXXXXX ',
    '   X    ',
    '   X    ',
    '   X    ',
  ],
  scales: [
    '   X    ',
    ' XXXXX  ',
    ' X X X  ',
    'XX X XX ',
    '   X    ',
    '   X    ',
    '  XXX   ',
    ' XXXXX  ',
  ],
  pyramid: [
    '   X    ',
    '   XX   ',
    '  XXX   ',
    '  XXXX  ',
    ' XXXXX  ',
    ' XXXXXX ',
    'XXXXXXX ',
    'XXXXXXXX',
  ],
  lyre: [
    ' X    X ',
    ' X    X ',
    ' XXXXXX ',
    ' XX  XX ',
    ' XXXXXX ',
    ' X X  X ',
    ' X X  X ',
    ' XXXXXX ',
  ],
  figures: [
    '  X X   ',
    ' XXXXX  ',
    '  X X   ',
    ' XX XX  ',
    'X X X X ',
    '  X X   ',
    ' XX XX  ',
    ' XX XX  ',
  ],
};

function drawGlyph(x, y, kind, color) {
  ctx.fillStyle = color || '#ffd700';
  const pat = GLYPHS[kind];
  if (!pat) return;
  for (let py = 0; py < 8; py++) {
    for (let px = 0; px < 8; px++) {
      if (pat[py][px] === 'X') ctx.fillRect(x + px, y + py, 1, 1);
    }
  }
}

// ==== DRAW =============================================================

function drawGroundBase() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const isBorder = c <= 1 || c >= COLS - 2 || r <= 1 || r >= ROWS - 2;
      const isPath = r >= 6 && r <= 8;
      if (isPath) continue;
      if (townSheet) {
        drawTile(townSheet, isBorder ? 1 : 0, 1, c * TILE, r * TILE);
        if (isBorder) {
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
        }
      } else {
        ctx.fillStyle = isBorder ? '#2a4f18' : '#4a8c30';
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
      }
    }
  }
}

function drawWell() {
  if (!townSheet) return;
  const cx = Math.floor(VW / 2);
  drawTile(townSheet, 5, 1, cx * TILE, 7 * TILE);
}

function drawPaths() {
  // Main cobblestone road — rows 6–8
  for (let r = 6; r <= 8; r++) {
    for (let c = 0; c < COLS; c++) {
      if (townSheet) {
        drawTile(townSheet, 0, 0, c * TILE, r * TILE);
      } else {
        ctx.fillStyle = '#707068';
        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
      }
    }
  }

  if (!townSheet) return;
  // Dirt approach paths — 1 tile wide, green on L/R sides (col=9,row=0)
  // Building center columns: hod=2, geburah=7, malkuth=12, yesod=17
  const cols = [2, 7, 12, 17];
  cols.forEach(c => {
    // Top approach: rows 3–5 (path up to cobblestone road)
    for (let r = 3; r <= 5; r++) drawTile(townSheet, 9, 0, c * TILE, r * TILE);
    // Bottom approach: rows 9–11
    for (let r = 9; r <= 11; r++) drawTile(townSheet, 9, 0, c * TILE, r * TILE);
  });
}

function drawBuilding(d) {
  if (buildingsSheet) {
    ctx.drawImage(buildingsSheet, d.sx, d.sy, d.sw, d.sh, d.px, d.py, d.w, d.h);
  } else {
    ctx.fillStyle = d.roof;
    ctx.globalAlpha = 0.7;
    ctx.fillRect(d.px, d.py, d.w, d.h);
    ctx.globalAlpha = 1;
    drawGlyph(d.px + d.w / 2 - 4, d.py + d.h / 2 - 4, d.glyph, '#fff');
  }
}

function drawTree(c, r) {
  const x = c * TILE, y = r * TILE;
  ctx.fillStyle = '#5a3010';
  ctx.fillRect(x + 6, y + 10, 4, 6);
  ctx.fillStyle = '#1a6020';
  ctx.fillRect(x + 2, y + 5, 12, 8);
  ctx.fillStyle = '#2a8030';
  ctx.fillRect(x + 4, y + 2, 8, 7);
  ctx.fillStyle = '#3aa040';
  ctx.fillRect(x + 6, y, 4, 5);
  ctx.fillStyle = '#5aba55';
  ctx.fillRect(x + 7, y + 1, 2, 2);
}

function drawTrees() {
  const dirtPathCols = new Set([2, 7, 12, 17]);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (r >= 6 && r <= 8) continue; // road
      if (solid[r]?.[c]) continue;    // building footprint
      if (dirtPathCols.has(c) && ((r >= 3 && r <= 5) || (r >= 9 && r <= 11))) continue;
      const isBorder = c <= 1 || c >= COLS - 2 || r <= 1 || r >= ROWS - 2;
      const density = isBorder ? 0.65 : 0.07;
      const hash = (Math.imul(c * 1234567, r * 891011) ^ (c * 31 + r * 17)) >>> 0;
      if ((hash / 0xffffffff) < density) drawTree(c, r);
    }
  }
}

function drawPlayer() {
  const px = player.x * TILE;
  const py = player.y * TILE;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(px + 6, py + TILE - 2, 20, 2);
  if (playerSheet) {
    const row = { down: 0, left: 1, right: 2, up: 3 }[player.dir] ?? 0;
    ctx.drawImage(playerSheet, 16, row * 20, 16, 20, px, py - 8, 32, 40);
  } else {
    // fillRect fallback while sheet loads
    ctx.fillStyle = '#2d1b4e';
    ctx.fillRect(px + 5, py + 2, 6, 5);
    ctx.fillStyle = '#ffe5c0';
    ctx.fillRect(px + 6, py + 5, 4, 2);
    ctx.fillStyle = '#5a2d8f';
    ctx.fillRect(px + 4, py + 7, 8, 7);
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(px + 4, py + 13, 8, 1);
  }
}

function drawDialog() {
  if (!dialogOpen) return;
  const dy = H - 100;
  ctx.fillStyle = '#1a0f2e';
  ctx.fillRect(8, dy, W - 16, 92);
  ctx.strokeStyle = '#ff6ec7';
  ctx.lineWidth = 2;
  ctx.strokeRect(9, dy + 1, W - 18, 90);
  ctx.strokeStyle = '#5ac8fa';
  ctx.strokeRect(15, dy + 7, W - 30, 78);
  ctx.fillStyle = '#fff';
  ctx.font = '16px "Courier New", monospace';
  const lines = dialogText.split('\n');
  let charsRemaining = dialogShown;
  lines.forEach((line, i) => {
    const visible = line.substring(0, Math.max(0, charsRemaining));
    ctx.fillText(visible, 24, dy + 30 + i * 20);
    charsRemaining -= line.length;
  });
  if (dialogShown >= dialogText.length) {
    ctx.fillStyle = '#ffd700';
    ctx.fillText('A', W - 36, dy + 78);
    ctx.fillRect(W - 52, dy + 62, 8, 8);
  }
}

function render() {
  drawGroundBase();
  drawPaths();
  drawTrees();
  drawWell();
  DOMAINS.forEach(drawBuilding);
  drawPlayer();
  drawDialog();
}

// ==== MOVEMENT =========================================================
function tryMove(dx, dy) {
  if (dialogOpen) return;
  const newDir = dy < 0 ? 'up' : dy > 0 ? 'down' : dx < 0 ? 'left' : 'right';
  player.dir = newDir;
  const nx = player.x + dx;
  const ny = player.y + dy;
  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;
  if (solid[ny][nx]) return;
  player.x = nx;
  player.y = ny;
}

function findFacingDomain() {
  let dx = 0, dy = 0;
  if (player.dir === 'up')    dy = -1;
  if (player.dir === 'down')  dy = 1;
  if (player.dir === 'left')  dx = -1;
  if (player.dir === 'right') dx = 1;
  const tx = player.x + dx;
  const ty = player.y + dy;
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return null;
  if (!solid[ty][tx]) return null;
  return DOMAINS.find(d =>
    tx >= d.solidCol && tx < d.solidCol + d.solidW &&
    ty >= d.solidRow && ty < d.solidRow + d.solidH
  );
}

function pressA() {
  if (dialogOpen) {
    if (dialogShown < dialogText.length) {
      dialogShown = dialogText.length; // skip typewriter
      return;
    }
    if (dialogDomain) {
      window.location.href = '../system.html?v=' + Date.now() + '#' + dialogDomain.key;
    }
    return;
  }
  const d = findFacingDomain();
  if (d) {
    dialogOpen = true;
    dialogDomain = d;
    dialogText = `${d.name} TEMPLE\n\nEnter? Press A.`;
    dialogShown = 0;
    typewriterTick = 0;
  }
}

function pressB() {
  if (dialogOpen) {
    dialogOpen = false;
    dialogDomain = null;
    return;
  }
  window.location.href = '../system.html?v=' + Date.now();
}

// ==== INPUT ============================================================
const KEY_MAP = {
  ArrowUp:    () => tryMove(0, -1),
  ArrowDown:  () => tryMove(0, 1),
  ArrowLeft:  () => tryMove(-1, 0),
  ArrowRight: () => tryMove(1, 0),
  w: () => tryMove(0, -1),
  s: () => tryMove(0, 1),
  a: () => tryMove(-1, 0),
  d: () => tryMove(1, 0),
  z: pressA,
  ' ': pressA,
  Enter: pressA,
  x: pressB,
  Escape: pressB,
};
window.addEventListener('keydown', e => {
  const fn = KEY_MAP[e.key];
  if (fn) { e.preventDefault(); fn(); }
});

document.querySelectorAll('button[data-key]').forEach(btn => {
  const key = btn.getAttribute('data-key');
  let interval = null;
  const fire = () => {
    if (key === 'a') pressA();
    else if (key === 'b') pressB();
    else KEY_MAP[key]?.();
  };
  const start = e => {
    e.preventDefault();
    fire();
    if (key.startsWith('Arrow')) interval = setInterval(fire, 160);
  };
  const stop = e => {
    e.preventDefault();
    if (interval) { clearInterval(interval); interval = null; }
  };
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', stop, { passive: false });
  btn.addEventListener('touchcancel', stop, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
});

// ==== LOOP =============================================================
function tick() {
  // Typewriter (3 frames per char ≈ 50ms)
  if (dialogOpen && dialogShown < dialogText.length) {
    typewriterTick++;
    if (typewriterTick >= 2) {
      dialogShown++;
      typewriterTick = 0;
    }
  }
  render();
  requestAnimationFrame(tick);
}

// Start loop immediately (renders with fillRect fallbacks while sheets load)
requestAnimationFrame(tick);
loadImage('assets/terrain_atlas.png').then(sheet => { terrainSheet = sheet; });
loadImage('assets/archival/town_tiles.png').then(sheet => { townSheet = sheet; });
loadImage(`assets/sprite_split/character_${PLAYER_CHAR}/character_${PLAYER_CHAR}_frame16x20.png`)
  .then(sheet => { playerSheet = sheet; });
loadImage('assets/buildings/Buildings_Colour2.png').then(sheet => { buildingsSheet = sheet; });
</script>
</body>
</html>
