<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cybernetica — Island</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #0d1e35;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
.map-wrap {
  position: relative;
  display: inline-block;
  max-width: 100vw;
  max-height: 100vh;
  line-height: 0;
}
.map-wrap img {
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  display: block;
}
.spot {
  position: absolute;
  cursor: pointer;
  border-radius: 6px;
}
.spot:hover {
  background: rgba(255, 255, 255, 0.12);
  outline: 2px solid rgba(255, 255, 255, 0.35);
}
.spot:active {
  background: rgba(255, 255, 255, 0.28);
}
.spot::after {
  content: attr(data-label);
  position: absolute;
  bottom: calc(100% + 5px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(5, 8, 20, 0.92);
  color: #c8b97a;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 2px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
}
.spot:hover::after { opacity: 1; }
</style>
</head>
<body>
<div class="map-wrap">
  <img src="island.png" alt="Cybernetica Island">

  <!-- 9 domains -->
  <div class="spot" data-label="Strength"   onclick="go('#geburah')"    style="left:22%;top:7%;width:20%;height:23%"></div>
  <div class="spot" data-label="Intake"     onclick="go('#malkuth')"    style="left:47%;top:7%;width:19%;height:21%"></div>
  <div class="spot" data-label="Recovery"   onclick="go('#yesod')"      style="left:17%;top:31%;width:24%;height:21%"></div>
  <div class="spot" data-label="Finance"    onclick="go('#chesed')"     style="left:54%;top:33%;width:22%;height:20%"></div>
  <div class="spot" data-label="Creation"   onclick="go('#netzach')"    style="left:18%;top:53%;width:22%;height:20%"></div>
  <div class="spot" data-label="Structure"  onclick="go('#binah')"      style="left:38%;top:55%;width:20%;height:28%"></div>
  <div class="spot" data-label="Social"     onclick="go('#chokmah')"    style="left:60%;top:54%;width:19%;height:20%"></div>
  <div class="spot" data-label="Attunement" onclick="go('#pillar')"     style="left:18%;top:74%;width:24%;height:23%"></div>
  <div class="spot" data-label="Intellect"  onclick="go('#hod')"        style="left:78%;top:65%;width:21%;height:25%"></div>

  <!-- Signal: mountain temple -->
  <div class="spot" data-label="Signal"     onclick="go('&tab=signal')" style="left:76%;top:5%;width:24%;height:18%"></div>

  <!-- Dock: back to base -->
  <div class="spot" data-label="← Base"     onclick="goBase()"          style="left:1%;top:59%;width:14%;height:15%"></div>
</div>

<script>
function go(dest) {
  window.location.href = '../system.html?v=' + Date.now() + '&from=arcade' + dest;
}
function goBase() {
  window.location.href = '../system.html?v=' + Date.now();
}
</script>
</body>
</html>
