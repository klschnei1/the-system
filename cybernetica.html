<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybernetica</title>
<link rel="manifest" href="manifest.json">
<style>
  body { background: #07070f; margin: 0; }
</style>
</head>
<body>
<script>
  // Daily seed — same skin all day, different tomorrow
  const now = new Date();
  const today = (now.getHours() < 3 || (now.getHours() === 3 && now.getMinutes() < 30))
    ? new Date(now - 86400000).toLocaleDateString('en-CA')
    : now.toLocaleDateString('en-CA');
  const seed = [...today].reduce((h, c) => ((h << 5) - h + c.charCodeAt(0)) | 0, 0);

  const skins = [
    'system.html',
    // 'sleeves/arcade.html',  // unlock when verified
  ];

  // Manual sleeve override: cybernetica.html?sleeve=arcade
  const params = new URLSearchParams(window.location.search);
  const override = params.get('sleeve');
  const overrideMap = { arcade: 'sleeves/arcade.html', system: 'system.html' };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  const target = override && overrideMap[override]
    ? overrideMap[override]
    : skins[Math.abs(seed) % skins.length];
  window.location.replace(target + '?v=' + Date.now());
</script>
</body>
</html>
